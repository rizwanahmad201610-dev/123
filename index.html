<!DOCTYPE html>

<html>

<head>

<title>Magic Colour Button</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="box">

<h1>Magic Colour Button</h1>

<button onclick="changeColor()">

Click for Magic!

</button>

</div>

<script>

function changeColor() {

document.querySelector("button").style.backgroundColor = "tomato";

document.querySelector("button").innerHTML = "Colour Changed!";

}

</script>

</body>

</html>
